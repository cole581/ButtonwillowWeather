name: Collect weather

on:
  # Main trigger: an outside scheduler (cron-job.org) calls workflow_dispatch every 15 min.
  # GitHub's own schedule is only a backup: it is best-effort and often late or skipped.
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:        # "Run workflow" button, and the API call the outside scheduler makes

permissions:
  contents: write           # lets the job commit the new data back to the repo

concurrency:
  group: collect-weather
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch WeatherXM observation + NWS forecast
        id: collect
        run: python scripts/collect.py
        continue-on-error: true   # still rebuild and commit the run log if both sources failed

      - name: Rebuild dashboard and matched table
        run: python scripts/build.py

      - name: Commit data
        run: |
          git config user.name  "weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weather data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Flag failed collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Both WeatherXM and NWS failed this hour. See data/runs.csv."
          exit 1
